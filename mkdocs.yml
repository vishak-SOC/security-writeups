site_name: Security Writeups
site_description: A portfolio of SOC-style security investigations, featuring full kill-chain analysis and network forensics.
# ✅ UPDATED WITH YOUR URL
site_url: https://vishak-SOC.github.io/security-writeups/

theme:
  name: material
  language: en
  palette:
    - scheme: slate
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  font: false
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.sections
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - tables

nav:
  
  # 2. Your Case Studies
  - Investigations:
      - First Shift (Case Study):
          - Dashboard: tryhackme/first-shift/index.md
          - Task 3 – Auth Triage: tryhackme/first-shift/task-3-probably-just-fine.md
          - Task 4 – Phishing: tryhackme/first-shift/task-4-phishing-books.md
          - Task 5 – Portal Drop: tryhackme/first-shift/task-5-Portal-Drop.md
          - Task 6 – Zero Tolerance: tryhackme/first-shift/task-6-Zero-Tolerance.md
          - Task 7 – Crown Jewel: tryhackme/first-shift/task-7-The-Crown-Jewel.md
          - Task 8 – Promotion Night: tryhackme/first-shift/task-8-Promotion-Night.md

  - Honeynet Collapse (Ransomware):
          - Dashboard: tryhackme/honeynet-collapse/index.md
          - Task 1 Initial Access: tryhackme/honeynet-collapse/task-1-initial-access.md
          - Task 2 Windows Triage: tryhackme/honeynet-collapse/task-2-windows-movement.md
          - Task 3 Memory Forensics: tryhackme/honeynet-collapse/task-3-memory-forensics.md
          - Task 4 Disk Analysis: tryhackme/honeynet-collapse/task-4-disk-forensics.md
          - Task 5 File System: tryhackme/honeynet-collapse/task-5-file-system.md
          - Task 6 MacOS Forensics: tryhackme/honeynet-collapse/task-6-macos.md